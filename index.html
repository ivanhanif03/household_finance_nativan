<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keuangan Rumah Tangga Nativan</title>

  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-512.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finance Nativan" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-soft: #e8f0ff;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --radius: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: linear-gradient(180deg, #f4f7ff, #f8fafc);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 680px; }
    .balance {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 28px; padding: 26px;
      text-align: center; color: white;
      box-shadow: 0 20px 40px rgba(37,99,235,.35);
      position: relative; overflow: hidden;
    }
    .balance::after {
      content: ""; position: absolute;
      width: 200px; height: 200px;
      background: rgba(255,255,255,.15);
      border-radius: 50%; top: -80px; right: -60px;
      filter: blur(20px);
    }
    .balance h2 { font-weight: 700; }
    .sub-balances { display: flex; gap: 10px; margin-top: 15px; }
    .sub-balance {
      flex: 1; background: rgba(255,255,255,.18);
      backdrop-filter: blur(6px); border-radius: 12px;
      padding: 10px; font-size: .65rem; cursor: pointer; transition: .18s;
    }
    .sub-balance:hover { transform: translateY(-2px); background: rgba(255,255,255,.25); }
    .summary-card {
      background: var(--card); border-radius: var(--radius);
      padding: 16px; text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.05);
    }
    .summary-card h6 { font-size: .8rem; color: var(--muted); margin-bottom: 5px; }
    .summary-card h3 { font-size: 1.15rem; font-weight: 700; }
    .form-control, .form-select {
      border-radius: 12px; border: 1px solid #e5e7eb; font-size: .9rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft);
    }
    .btn-blue {
      background: var(--primary); border: none; color: white;
      font-weight: 600; border-radius: 12px; padding: 10px; transition: .15s;
    }
    .btn-blue:hover { background: #1d4ed8; transform: translateY(-1px); }
    .riwayat-title {
      font-weight: 600; text-align: center;
      margin-top: 35px; margin-bottom: 12px;
      font-size: 1.2rem; color: var(--primary);
    }
    .filter-export {
      display: flex; gap: 10px; align-items: center;
      background: white; border-radius: 14px;
      padding: 10px 12px; box-shadow: 0 3px 10px rgba(0,0,0,.05);
    }
    #filter {
      flex: 1; border: none; background: #f3f4f6;
      border-radius: 10px; padding: 8px 12px; font-size: .9rem;
    }
    #filter:focus { outline: none; background: white; box-shadow: 0 0 0 2px var(--primary-soft); }
    .btn-export {
      background: var(--success); border: none; color: white;
      padding: 8px 14px; border-radius: 10px; font-size: .85rem;
    }
    .btn-export:hover { transform: translateY(-1px); }
    .tanggal-filter { margin-top: 12px; }
    .tanggal-filter input {
      border-radius: 10px; border: 1px solid #e5e7eb;
      font-size: .85rem; padding: 6px 8px;
    }
    .tanggal-filter button {
      border: none; background: var(--primary);
      color: white; padding: 6px 10px; border-radius: 10px;
    }
    .riwayat-container { margin-top: 18px; }
    .trx-card {
      background: white; border-radius: 18px;
      padding: 14px 16px; margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
      transition: .25s; animation: fadeUp .35s ease;
    }
    .trx-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.12); }
    .trx-header {
      display: flex; justify-content: space-between;
      border-bottom: 1px dashed #eee; padding-bottom: 3px;
    }
    .trx-header h6 { font-size: .85rem; font-weight: 600; color: var(--primary); }
    .trx-date { font-size: .75rem; color: var(--muted); }
    .trx-detail { font-size: .82rem; display: flex; justify-content: space-between; }
    .trx-nominal { font-weight: 700; }
    .trx-nominal.pendapatan { color: var(--success); }
    .trx-nominal.pengeluaran { color: var(--danger); }
    .trx-deskripsi { font-size: .78rem; color: var(--muted); font-style: italic; }
    #loadingOverlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,.7); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 9999;
    }
    .spinner {
      border: 4px solid #e5e7eb; border-top: 4px solid var(--primary);
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin .7s linear infinite;
    }
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: #ef4444; color: white;
      padding: 10px 18px; border-radius: 10px;
      font-size: .85rem; box-shadow: 0 4px 12px rgba(0,0,0,.15);
      opacity: 0; transition: .3s; z-index: 99999;
    }
    .toast.show { opacity: 1; }
    #overlayToast {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(.8);
      background: var(--success); color: white;
      padding: 16px 24px; border-radius: 12px;
      opacity: 0; transition: .3s;
    }
    #overlayToast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @media(max-width:500px) {
      .filter-export { flex-direction: column; align-items: stretch; }
      .btn-export { width: 100%; }
      .trx-header { flex-direction: column; align-items: flex-start; }
    }
    .fab-add {
      position: fixed; bottom: 25px; right: 20px;
      width: 60px; height: 60px; border: none; border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #4f46e5); color: white;
      font-size: 30px; box-shadow: 0 15px 30px rgba(37,99,235,.35);
      cursor: pointer; transition: .2s; z-index: 999;
    }
    .fab-add:hover { transform: scale(1.08); }
    .modal-ios {
      position: fixed; bottom: -100%; left: 0; width: 100%;
      background: white; border-radius: 22px 22px 0 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,.15);
      padding: 20px; transition: bottom .35s ease;
      z-index: 1000; max-height: 85vh; overflow-y: auto;
    }
    .modal-ios.show { bottom: 0; }
    .modal-backdrop-ios {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.35); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: .25s; z-index: 999;
    }
    .modal-backdrop-ios.show { opacity: 1; pointer-events: auto; }
    .modal-handle {
      width: 40px; height: 5px; background: #d1d5db;
      border-radius: 5px; margin: 0 auto 15px;
    }
    .budget-card {
      background: linear-gradient(135deg,#d9ffe7,#16a34a);
      border-radius: 20px; padding: 18px; color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,.1); margin-bottom: 16px;
    }
    .budget-progress {
      height: 10px; background: rgba(255,255,255,.25);
      border-radius: 10px; margin-top: 10px;
    }
    .budget-bar {
      height: 100%; border-radius: 10px; width: 0%;
      background: #22c55e; transition: width .4s ease;
    }
    .budget-warning { font-size: .8rem; margin-top: 6px; font-weight: 600; }
    .warning80 { color: #fde047; }
    .warning90 { color: #fb923c; }
    .warning100 { color: #ef4444; }
    .budget-input { display: flex; gap: 8px; margin-top: 10px; }
    .budget-input input { flex: 1; border-radius: 10px; border: none; padding: 6px 10px; }
    .budget-input button {
      border: none; background: white; color: #16a34a;
      font-weight: 600; border-radius: 10px; padding: 6px 12px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Debug panel — hanya tampil jika ada error */
    #debugPanel {
      display: none;
      background: #1e293b; color: #f1f5f9;
      border-radius: 12px; padding: 12px;
      font-size: .75rem; font-family: monospace;
      margin-top: 12px; word-break: break-all;
    }
    #debugPanel.show { display: block; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:10000;display:flex;align-items:center;justify-content:center;">
    <div style="width:90%;max-width:320px;text-align:center">
      <h3 style="color:#2563eb;font-weight:700;margin-bottom:20px">🔐 Keuangan Nativan</h3>
      <input type="password" id="passwordInput" class="form-control mb-3" placeholder="Masukkan Password">
      <button class="btn btn-blue w-100" onclick="checkPassword()">Masuk</button>
      <div id="loginError" style="color:red;margin-top:10px"></div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="overlayToast"><span id="overlayToastText">✅ Berhasil!</span></div>
  </div>

  <div class="container mx-auto px-3">
    <div id="modalBackdrop" class="modal-backdrop-ios" onclick="closeModal()"></div>

    <!-- Modal Tambah Transaksi -->
    <div id="modalTambah" class="modal-ios">
      <div class="modal-handle"></div>
      <h5 class="fw-bold mb-3 text-center" style="color:#04215f">Tambah Transaksi</h5>

      <div class="mb-3">
        <label class="form-label">Jenis</label>
        <select id="jenis" class="form-select">
          <option value="Pendapatan">Pendapatan</option>
          <option value="Pengeluaran">Pengeluaran</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Kategori</label>
        <input type="text" id="kategori" class="form-control" placeholder="Contoh: Gaji, Makan, Transport">
      </div>
      <div class="mb-3">
        <label class="form-label">Nominal</label>
        <input type="text" id="nominal" class="form-control" placeholder="Contoh: 1.500.000">
      </div>
      <div class="mb-3">
        <label class="form-label">Deskripsi</label>
        <input type="text" id="deskripsi" class="form-control" placeholder="Keterangan tambahan">
      </div>
      <div class="mb-3">
        <label class="form-label">Kepemilikan</label>
        <select id="kepemilikan" class="form-select">
          <option value="Ayah">Ayah</option>
          <option value="Ibun">Ibun</option>
          <option value="Izora">Izora</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Dompet</label>
        <select id="dompet" class="form-select">
          <option value="Cash">Cash</option>
          <option value="M-Banking">M-Banking</option>
          <option value="E-Wallet">E-Wallet</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Detail Dompet</label>
        <select id="dompetDetail" class="form-select"><option value="">-- Pilih --</option></select>
      </div>

      <button id="btnSimpan" class="btn btn-blue w-100" onclick="simpanTransaksi()">Simpan</button>
      <div id="debugPanel"></div>
    </div>

    <div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999"></div>

    <!-- Saldo -->
    <div class="balance mb-3 mt-3">
      <h5>Saldo Total</h5>
      <h2 id="saldo">Rp 0</h2>
      <div class="sub-balances">
        <div class="sub-balance" onclick="toggleDetail('Cash')">Cash<br/><span id="saldoCash">Rp 0</span></div>
        <div class="sub-balance" onclick="toggleDetail('M-Banking')">M-Banking<br/><span id="saldoBank">Rp 0</span></div>
        <div class="sub-balance" onclick="toggleDetail('E-Wallet')">E-Wallet<br/><span id="saldoWallet">Rp 0</span></div>
      </div>
      <div class="detail-wrapper mt-3">
        <div id="detailSaldoContainer" style="overflow:hidden;height:0;transition:height 0.4s ease"></div>
      </div>
    </div>

    <!-- Summary -->
    <div class="row text-center mb-3">
      <div class="col-6">
        <div class="summary-card"><h6>Pendapatan</h6><h3 id="totalPendapatan">Rp 0</h3></div>
      </div>
      <div class="col-6">
        <div class="summary-card"><h6>Pengeluaran</h6><h3 id="totalPengeluaran">Rp 0</h3></div>
      </div>
    </div>

    <!-- Budget -->
    <div class="budget-card">
      <h6>📊 Budget Pengeluaran Bulanan</h6>
      <h4 id="budgetSisa">Rp 0</h4>
      <div class="budget-progress"><div class="budget-bar" id="budgetBar"></div></div>
      <div id="budgetWarning" class="budget-warning"></div>
      <div class="budget-input">
        <input type="text" id="budgetInput" placeholder="Set budget bulanan">
        <button id="btnBudget" onclick="setBudget()">Set</button>
      </div>
      <small>Budget akan otomatis terakumulasi dari sisa bulan sebelumnya</small>
    </div>

    <!-- Riwayat -->
    <div class="riwayat-title">📜 Riwayat Transaksi</div>
    <div class="filter-export">
      <input type="text" id="filter" placeholder="Cari transaksi..." onkeyup="filterTable()" />
      <button class="btn-export" onclick="exportExcel()">📤 Export Excel</button>
    </div>
    <div class="tanggal-filter">
      <div class="d-flex w-100 gap-2 justify-content-center">
        <input type="date" id="startDate" class="flex-fill" />
        <input type="date" id="endDate" class="flex-fill" />
        <button onclick="filterTanggal()">🔍</button>
      </div>
    </div>
    <div class="riwayat-container" id="riwayatContainer"></div>
  </div>

  <script>
    // ─────────────────────────────────────────────────
    // ⚠️  GANTI URL INI setiap kali deploy ulang GAS
    // ─────────────────────────────────────────────────
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx85BqK5LKIzJd9xoxiMkoViIsxBZqYaCJ7cKHhIprcDx6TWVXzyiznYQCvExSjzhRJ/exec";

    let semuaData   = [];
    let semuaBudget = [];

    // ─────────────────────────────────────────────────
    // CORE: semua request ke GAS pakai GET + query string
    // Ini satu-satunya cara yang 100% bebas CORS dari
    // GitHub Pages → Google Apps Script tanpa backend.
    // ─────────────────────────────────────────────────
    async function gasCall(params) {
      const qs  = new URLSearchParams({ ...params, _t: Date.now() }).toString();
      const url = SCRIPT_URL + "?" + qs;

      console.log("[gasCall] →", url);

      const res = await fetch(url, { method: "GET", cache: "no-store" });

      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);

      const text = await res.text();
      console.log("[gasCall] ←", text.slice(0, 200));

      let json;
      try {
        json = JSON.parse(text);
      } catch (_) {
        throw new Error("Response bukan JSON: " + text.slice(0, 100));
      }

      return json;
    }

    // ─────────────────────────────────────────────────
    // UI helpers
    // ─────────────────────────────────────────────────
    const showLoading = (v) => {
      document.getElementById("loadingOverlay").style.display = v ? "flex" : "none";
    };

    const formatRupiah = (n) =>
      "Rp " + Math.abs(Number(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    const formatTanggal = (t) => {
      const d = new Date(t);
      if (isNaN(d)) return "-";
      return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    };

    const capitalizeFirst = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : "";

    function showToast(msg, duration = 3000, type = "info") {
      const wrap  = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className   = "toast";
      toast.textContent = msg;
      if (type === "error")   toast.style.background = "#e63946";
      if (type === "success") toast.style.background = "#22a707";
      wrap.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add("show"));
      setTimeout(() => {
        toast.classList.remove("show");
        toast.addEventListener("transitionend", () => toast.remove(), { once: true });
      }, duration);
    }

    let _overlayBusy = false;
    function showOverlayToast(msg = "✅ Berhasil!", dur = 1800) {
      if (_overlayBusy) return;
      _overlayBusy = true;
      const el = document.getElementById("overlayToast");
      document.getElementById("overlayToastText").textContent = msg;
      el.classList.remove("show");
      el.offsetWidth; // reflow
      el.classList.add("show");
      setTimeout(() => { el.classList.remove("show"); _overlayBusy = false; }, dur);
    }

    function showDebug(msg) {
      const p = document.getElementById("debugPanel");
      p.textContent = "DEBUG: " + msg;
      p.classList.add("show");
    }

    // ─────────────────────────────────────────────────
    // Form: dompet detail
    // ─────────────────────────────────────────────────
    const jenisEl       = document.getElementById("jenis");
    const kategoriEl    = document.getElementById("kategori");
    const nominalEl     = document.getElementById("nominal");
    const deskripsiEl   = document.getElementById("deskripsi");
    const dompetEl      = document.getElementById("dompet");
    const kepemilikanEl = document.getElementById("kepemilikan");
    const dompetDetailEl= document.getElementById("dompetDetail");

    const detailOptions = {
      Cash:       ["Cash"],
      "M-Banking":["BTN","Mandiri","BRI","BSI"],
      "E-Wallet": ["Gopay","Dana","OVO","ShopeePay","LinkAja"],
    };

    function updateDetailDompet() {
      const opts = detailOptions[dompetEl.value] || [];
      dompetDetailEl.innerHTML = '<option value="">-- Pilih --</option>';
      opts.forEach(o => {
        const el = document.createElement("option");
        el.value = el.textContent = o;
        dompetDetailEl.appendChild(el);
      });
    }

    dompetEl.addEventListener("change", updateDetailDompet);
    window.addEventListener("DOMContentLoaded", updateDetailDompet);

    nominalEl.addEventListener("input", e => {
      e.target.value = e.target.value.replace(/\D/g,"").replace(/\B(?=(\d{3})+(?!\d))/g,".");
    });

    document.getElementById("budgetInput").addEventListener("input", e => {
      e.target.value = e.target.value.replace(/\D/g,"").replace(/\B(?=(\d{3})+(?!\d))/g,".");
    });

    // ─────────────────────────────────────────────────
    // SIMPAN TRANSAKSI
    // ─────────────────────────────────────────────────
    async function simpanTransaksi() {
      const kategori    = kategoriEl.value.trim();
      const nominal     = nominalEl.value.replace(/\./g,"");

      if (!kategori)  return showToast("Kategori wajib diisi!", 3000, "error");
      if (!nominal)   return showToast("Nominal wajib diisi!", 3000, "error");

      const btn = document.getElementById("btnSimpan");
      btn.disabled = true;
      showLoading(true);

      try {
        const result = await gasCall({
          action:       "addTransaksi",
          jenis:        jenisEl.value,
          kategori,
          nominal,
          deskripsi:    deskripsiEl.value.trim(),
          dompet:       dompetEl.value,
          dompetDetail: dompetDetailEl.value,
          kepemilikan:  kepemilikanEl.value,
        });

        showLoading(false);

        if (result.status === "OK") {
          showOverlayToast("✅ Transaksi tersimpan!");
          closeModal();
          kategoriEl.value = nominalEl.value = deskripsiEl.value = "";
          setTimeout(loadData, 1500); // tunggu GAS selesai tulis
        } else {
          // Tampilkan pesan error spesifik dari GAS
          const errMsg = result.message || "Tidak ada pesan dari GAS";
          showToast("❌ " + errMsg, 5000, "error");
          showDebug(JSON.stringify(result));
        }

      } catch (err) {
        showLoading(false);
        console.error("[simpanTransaksi]", err);
        showToast("❌ Koneksi gagal: " + err.message, 5000, "error");
        showDebug(err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ─────────────────────────────────────────────────
    // LOAD DATA
    // ─────────────────────────────────────────────────
    async function loadData() {
      showLoading(true);
      try {
        const data = await gasCall({ action: "getData" });

        if (data.status === "ERROR") {
          showToast("❌ GAS error: " + data.message, 5000, "error");
          console.error("[loadData] GAS error:", data.message);
          showLoading(false);
          return;
        }

        semuaData   = data.transaksi || [];
        semuaBudget = data.budget    || [];

        handleBudgetUI();
        renderDashboard();
        renderRiwayat(filter3HariTerakhir(semuaData));

      } catch (err) {
        console.error("[loadData]", err);
        showToast("❌ Gagal load data: " + err.message, 5000, "error");
      }
      showLoading(false);
    }

    // ─────────────────────────────────────────────────
    // SET BUDGET
    // ─────────────────────────────────────────────────
    async function setBudget() {
      const val = document.getElementById("budgetInput").value.replace(/\./g,"");
      if (!val) return showToast("Isi nominal budget dulu!", 3000, "error");

      const now = new Date();
      const btn = document.getElementById("btnBudget");
      btn.disabled = true;
      showLoading(true);

      try {
        const result = await gasCall({
          action: "setBudget",
          bulan:  now.getMonth() + 1,
          tahun:  now.getFullYear(),
          budget: val,
        });

        showLoading(false);

        if (result.status === "OK") {
          showOverlayToast("✅ Budget tersimpan!");
          setTimeout(loadData, 1500);
        } else {
          const errMsg = result.message || "Tidak ada pesan dari GAS";
          showToast("❌ " + errMsg, 5000, "error");
          showDebug(JSON.stringify(result));
        }

      } catch (err) {
        showLoading(false);
        console.error("[setBudget]", err);
        showToast("❌ Koneksi gagal: " + err.message, 5000, "error");
      } finally {
        btn.disabled = false;
      }
    }

    // ─────────────────────────────────────────────────
    // RENDER & FILTER
    // ─────────────────────────────────────────────────
    function filter3HariTerakhir(data) {
      const batas = new Date();
      batas.setDate(batas.getDate() - 3);
      return data.filter(t => new Date(t.tanggal) >= batas);
    }

    function filterTanggal() {
      const s = document.getElementById("startDate").value;
      const e = document.getElementById("endDate").value;
      if (!s || !e) return showToast("Pilih tanggal awal dan akhir!");
      const start = new Date(s);
      const end   = new Date(e);
      end.setHours(23,59,59,999);
      renderRiwayat(semuaData.filter(t => { const d = new Date(t.tanggal); return d >= start && d <= end; }));
    }

    function renderDashboard() {
      let pendapatan=0, pengeluaran=0, cash=0, bank=0, wallet=0;
      semuaData.forEach(trx => {
        const n = Number(String(trx.nominal).replace(/\./g,"")) || 0;
        const j = String(trx.jenis||"").trim().toLowerCase();
        if (j === "pendapatan") {
          pendapatan += n;
          if (trx.dompet==="Cash") cash+=n; else if (trx.dompet==="M-Banking") bank+=n; else wallet+=n;
        } else if (j === "pengeluaran") {
          pengeluaran += n;
          if (trx.dompet==="Cash") cash-=n; else if (trx.dompet==="M-Banking") bank-=n; else wallet-=n;
        }
      });
      document.getElementById("totalPendapatan").textContent = formatRupiah(pendapatan);
      document.getElementById("totalPengeluaran").textContent = formatRupiah(pengeluaran);
      document.getElementById("saldo").textContent = formatRupiah(pendapatan - pengeluaran);
      document.getElementById("saldoCash").textContent  = formatRupiah(cash);
      document.getElementById("saldoBank").textContent  = formatRupiah(bank);
      document.getElementById("saldoWallet").textContent= formatRupiah(wallet);
      updateBudget();
    }

    let detailOpen = null;
    const detailCont = document.getElementById("detailSaldoContainer");

    function toggleDetail(tipe) {
      if (detailOpen === tipe) {
        detailCont.style.height = "0"; detailOpen = null; return;
      }
      detailCont.innerHTML = "";
      const df = semuaData.filter(t => t.dompet === tipe);
      if (!df.length) {
        detailCont.innerHTML = `<p class="text-center text-white">Tidak ada data ${tipe}</p>`;
      } else {
        const sum = {};
        df.forEach(t => {
          const key = `${t.kepemilikan} – ${t.dompetDetail}`;
          const n = Number(String(t.nominal).replace(/\./g,"")) || 0;
          sum[key] = (sum[key]||0) + (t.jenis.toLowerCase()==="pendapatan"?n:-n);
        });
        Object.entries(sum).forEach(([k,v]) => {
          const c = document.createElement("div");
          c.className = "summary-card mb-2";
          c.innerHTML = `<h6>${k}</h6><h3>${formatRupiah(v)}</h3>`;
          detailCont.appendChild(c);
        });
      }
      detailCont.style.display = "block";
      detailCont.style.height  = detailCont.scrollHeight + "px";
      detailOpen = tipe;
    }

    function renderRiwayat(data) {
      const c = document.getElementById("riwayatContainer");
      c.innerHTML = "";
      if (!data.length) { c.innerHTML = "<p class='text-center mt-3'>Tidak ada transaksi.</p>"; return; }
      data.slice().reverse().forEach(trx => {
        c.innerHTML += `
        <div class="trx-card">
          <div class="trx-header">
            <h6>${(trx.kategori||"").toUpperCase()}</h6>
            <span class="trx-date">${formatTanggal(trx.tanggal)}</span>
          </div>
          <div class="trx-detail">
            <span>${trx.jenis} • ${trx.kepemilikan} • ${trx.dompet} (${trx.dompetDetail})</span>
            <span class="trx-nominal ${(trx.jenis||"").toLowerCase()}">${formatRupiah(trx.nominal)}</span>
          </div>
          <small class="trx-deskripsi">${capitalizeFirst(trx.deskripsi||"-")}</small>
        </div>`;
      });
    }

    function filterTable() {
      const kw = document.getElementById("filter").value.toLowerCase();
      renderRiwayat(semuaData.filter(t =>
        (t.kategori+t.dompet+t.jenis+t.deskripsi).toLowerCase().includes(kw)
      ));
    }

    // ─────────────────────────────────────────────────
    // BUDGET UI
    // ─────────────────────────────────────────────────
    function updateBudget() {
      const now   = new Date();
      const bulan = now.getMonth() + 1;
      const tahun = now.getFullYear();
      const cur   = semuaBudget.find(b => b.bulan==bulan && b.tahun==tahun);

      if (!cur || !cur.budget) {
        document.getElementById("budgetSisa").textContent = "Belum ada budget bulan ini";
        document.getElementById("budgetBar").style.width  = "0%";
        document.getElementById("budgetWarning").innerHTML= "";
        return;
      }

      const persen = (cur.realisasi / cur.budget) * 100;
      const sisa   = cur.budget - cur.realisasi;

      document.getElementById("budgetSisa").textContent = "Sisa: " + formatRupiah(sisa);
      const bar = document.getElementById("budgetBar");
      bar.style.width = Math.min(persen,100) + "%";

      const warn = document.getElementById("budgetWarning");
      if      (persen >= 100) { bar.style.background="#ef4444"; warn.innerHTML="⚠ Budget HABIS";             warn.className="budget-warning warning100"; }
      else if (persen >=  90) { bar.style.background="#fb923c"; warn.innerHTML="⚠ Budget hampir habis (90%)"; warn.className="budget-warning warning90";  }
      else if (persen >=  80) { bar.style.background="#fde047"; warn.innerHTML="⚠ Budget sudah 80%";          warn.className="budget-warning warning80";  }
      else                    { bar.style.background="#22c55e"; warn.innerHTML="Budget bulan ini aman ✓";      warn.className="budget-warning"; }
    }

    function handleBudgetUI() {
      const now  = new Date();
      const cur  = semuaBudget.find(b => b.bulan==now.getMonth()+1 && b.tahun==now.getFullYear());
      const inp  = document.getElementById("budgetInput");
      const btn  = document.getElementById("btnBudget");
      if (cur && cur.budget) {
        inp.value    = cur.budget.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
        btn.textContent = "Edit";
      } else {
        inp.value    = "";
        btn.textContent = "Set";
      }
    }

    // ─────────────────────────────────────────────────
    // EXPORT CSV
    // ─────────────────────────────────────────────────
    function exportExcel() {
      let filtered = semuaData.slice();
      const kw     = document.getElementById("filter").value.toLowerCase();
      const sDate  = document.getElementById("startDate").value;
      const eDate  = document.getElementById("endDate").value;
      if (kw)    filtered = filtered.filter(t => (t.kategori+t.dompet+t.jenis+t.deskripsi).toLowerCase().includes(kw));
      if (sDate && eDate) {
        const s = new Date(sDate), e = new Date(eDate);
        e.setHours(23,59,59,999);
        filtered = filtered.filter(t => { const d=new Date(t.tanggal); return d>=s&&d<=e; });
      }
      if (!filtered.length) { showToast("Tidak ada data untuk diekspor!"); return; }
      const fmt = t => { const d=new Date(t); return isNaN(d)?"-":`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
      let csv = "Jenis,Kategori,Nominal,Deskripsi,Dompet,Tanggal\n";
      filtered.forEach(t => { csv += `${t.jenis},${t.kategori},${t.nominal},"${t.deskripsi}",${t.dompet},${fmt(t.tanggal)}\n`; });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
      a.download = "keuangan_nativan.csv"; a.click();
    }

    // ─────────────────────────────────────────────────
    // MODAL
    // ─────────────────────────────────────────────────
    function openModal()  {
      document.getElementById("debugPanel").classList.remove("show");
      document.getElementById("modalTambah").classList.add("show");
      document.getElementById("modalBackdrop").classList.add("show");
    }
    function closeModal() {
      document.getElementById("modalTambah").classList.remove("show");
      document.getElementById("modalBackdrop").classList.remove("show");
    }

    // ─────────────────────────────────────────────────
    // LOGIN
    // ─────────────────────────────────────────────────
    const APP_PASSWORD = "nativan300424";

    function checkPassword() {
      const v = document.getElementById("passwordInput").value;
      if (v === APP_PASSWORD) {
        localStorage.setItem("login_nativan", JSON.stringify({ status:true, time:Date.now() }));
        document.getElementById("loginScreen").style.display = "none";
        loadData();
      } else {
        document.getElementById("loginError").textContent = "Password salah";
      }
    }

    // Enter di input password
    document.getElementById("passwordInput").addEventListener("keydown", e => {
      if (e.key === "Enter") checkPassword();
    });

    window.addEventListener("load", () => {
      const raw = localStorage.getItem("login_nativan");
      if (!raw) return;
      const sess = JSON.parse(raw);
      if (Date.now() - sess.time < 60 * 60 * 1000) { // 1 jam
        document.getElementById("loginScreen").style.display = "none";
        loadData();
      } else {
        localStorage.removeItem("login_nativan");
      }
    });

    // Refresh sesi 12 jam
    (() => {
      const lt = localStorage.getItem("login_time");
      if (lt && Date.now() - lt > 43200000) localStorage.removeItem("login_nativan");
      localStorage.setItem("login_time", Date.now());
    })();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

    loadData();
  </script>

  <button class="fab-add" onclick="openModal()">＋</button>
</body>
</html>
