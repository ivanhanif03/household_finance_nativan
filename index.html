<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keuangan Rumah Tangga Nativan</title>

  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-512.png" />
  <meta name="apple-mobile-web-app-status-bar" content="#7b2cbf" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finance Nativan" />
  <meta name="theme-color" content="#2563eb" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0850d6" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-soft: #e8f0ff;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", sans-serif;

      background: linear-gradient(180deg, #f4f7ff, #f8fafc);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
    }

    .title {
      font-weight: 700;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      text-align: center;
      margin: 28px 0 20px;
      color: var(--primary);
      letter-spacing: .3px;
    }

    .balance {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 28px;
      padding: 26px;
      text-align: center;
      color: white;

      box-shadow:
        0 20px 40px rgba(37, 99, 235, .35);

      position: relative;
      overflow: hidden;
    }

    .balance::after {
      content: "";
      position: absolute;

      width: 200px;
      height: 200px;

      background: rgba(255, 255, 255, .15);

      border-radius: 50%;

      top: -80px;
      right: -60px;

      filter: blur(20px);
    }

    .balance h2 {
      font-weight: 700;
    }

    .sub-balances {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .sub-balance {
      flex: 1;
      background: rgba(255, 255, 255, .18);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 10px;
      font-size: .65rem;
      cursor: pointer;
      transition: .18s;
    }

    .sub-balance:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, .25);
    }

    .summary-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
    }

    .summary-card h6 {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .summary-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .form-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-top: 22px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .06);
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      font-size: .9rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft);
    }

    .btn-blue {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px;
      transition: .15s;
    }

    .btn-blue:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .riwayat-title {
      font-weight: 600;
      text-align: center;
      margin-top: 35px;
      margin-bottom: 12px;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .filter-export {
      display: flex;
      gap: 10px;
      align-items: center;
      background: white;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
    }

    #filter {
      flex: 1;
      border: none;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: .9rem;
    }

    #filter:focus {
      outline: none;
      background: white;
      box-shadow: 0 0 0 2px var(--primary-soft);
    }

    .btn-export {
      background: var(--success);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: .85rem;
    }

    .btn-export:hover {
      transform: translateY(-1px);
    }

    .tanggal-filter {
      margin-top: 12px;
    }

    .tanggal-filter input {
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: .85rem;
      padding: 6px 8px;
    }

    .tanggal-filter button {
      border: none;
      background: var(--primary);
      color: white;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .riwayat-container {
      margin-top: 18px;
    }

    .trx-card {
      background: white;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, .06);

      transition: .25s;
    }

    .trx-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .12);
    }

    .trx-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #eee;
      padding-bottom: 3px;
    }

    .trx-header h6 {
      font-size: .85rem;
      font-weight: 600;
      color: var(--primary);
    }

    .trx-date {
      font-size: .75rem;
      color: var(--muted);
    }

    .trx-detail {
      font-size: .82rem;
      display: flex;
      justify-content: space-between;
    }

    .trx-nominal {
      font-weight: 700;
    }

    .trx-nominal.pendapatan {
      color: var(--success);
    }

    .trx-nominal.pengeluaran {
      color: var(--danger);
    }

    .trx-deskripsi {
      font-size: .78rem;
      color: var(--muted);
      font-style: italic;
    }

    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin .7s linear infinite;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: .85rem;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
      opacity: 0;
      transition: .3s;
    }

    .toast.show {
      opacity: 1;
    }

    #overlayToast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.8);
      background: var(--success);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      opacity: 0;
      transition: .3s;
    }

    #overlayToast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width:500px) {

      .filter-export {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-export {
        width: 100%;
      }

      .trx-header {
        flex-direction: column;
        align-items: flex-start;
      }

    }

    .fab-add {
      position: fixed;
      bottom: 25px;
      right: 20px;

      width: 60px;
      height: 60px;

      border: none;
      border-radius: 20px;

      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;

      font-size: 30px;

      box-shadow:
        0 15px 30px rgba(37, 99, 235, .35);

      cursor: pointer;
      transition: .2s;
      z-index: 999;
    }

    .fab-add:hover {
      transform: scale(1.08);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;

      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(16px);

      border-top: 1px solid rgba(255, 255, 255, .4);

      display: flex;
      justify-content: space-around;

      padding: 10px 0;

      box-shadow: 0 -3px 12px rgba(0, 0, 0, .05);
    }

    .bottom-nav button {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 18px;
      color: #555;
      font-weight: 500;
    }

    .bottom-nav span {
      font-size: .65rem;
      margin-top: 2px;
    }

    /* iOS Modal Style */

    .modal-ios {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: white;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .15);
      padding: 20px;
      transition: bottom .35s ease;
      z-index: 1000;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-ios.show {
      bottom: 0;
    }

    .modal-backdrop-ios {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .35);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 999;
    }

    .modal-backdrop-ios.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-handle {
      width: 40px;
      height: 5px;
      background: #d1d5db;
      border-radius: 5px;
      margin: 0 auto 15px;
    }

    * {
      transition: all .2s ease;
    }

    .trx-card {
      animation: fadeUp .35s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .budget-card{
  background: linear-gradient(135deg,#22c55e,#16a34a);
  border-radius:20px;
  padding:18px;
  color:white;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}

.budget-progress{
  height:10px;
  background:rgba(255,255,255,.25);
  border-radius:10px;
  margin-top:10px;
}

.budget-bar{
  height:100%;
  border-radius:10px;
  width:0%;
  background:#22c55e;
  transition:width .4s ease;
}

.budget-warning{
  font-size:.8rem;
  margin-top:6px;
  font-weight:600;
}

.warning80{color:#fde047;}
.warning90{color:#fb923c;}
.warning100{color:#ef4444;}

.budget-input{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.budget-input input{
  flex:1;
  border-radius:10px;
  border:none;
  padding:6px 10px;
}

.budget-input button{
  border:none;
  background:white;
  color:#16a34a;
  font-weight:600;
  border-radius:10px;
  padding:6px 12px;
}
  </style>
</head>

    <div class="riwayat-title">📜 Riwayat Transaksi</div>

      <input type="text" id="filter" placeholder="Cari transaksi..." onkeyup="filterTable()" />

        📤 Export Excel
      </button>
    </div>

    <div class="tanggal-filter flex-wrap flex-md-nowrap">
      <div class="d-flex w-100 gap-2 justify-content-center">
        <input type="date" id="startDate" class="flex-fill" />
        <input type="date" id="endDate" class="flex-fill" />
        <button onclick="filterTanggal()">🔍</button>
      </div>
    </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbw6k_zAJQbu-y37sV0FYecQTc9F3Wo_SZ7IhteJrSWmLHhb50vYbYchGPlb_3WNWml9/exec";
    let semuaData = [];
    let semuaBudget = [];

    const showLoading = (show = true) => {
      document.getElementById("loadingOverlay").style.display = show
        ? "flex"
        : "none";
    };

    const formatRupiah = (angka) =>
      "Rp " + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const formatTanggal = (t) => {
      const d = new Date(t);
      if (isNaN(d)) return "-";
      return `${d.getDate().toString().padStart(2, "0")}/${(d.getMonth() + 1)
        .toString()
        .padStart(2, "0")}/${d.getFullYear()} ${d
          .getHours()
          .toString()
          .padStart(2, "0")}:${d.getMinutes().toString().padStart(2, "0")}`;
    };

    document.getElementById("nominal").addEventListener("input", (e) => {
      e.target.value = e.target.value
        .replace(/\D/g, "")
        .replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    });

    function capitalizeFirst(str) {
      return str
        ? str.charAt(0).toUpperCase() + str.slice(1).toLowerCase()
        : "";
    }

    function showNotif(msg) {
      const n = document.getElementById("notif");
      n.innerText = msg;
      setTimeout(() => (n.innerText = ""), 3000);
    }

    const jenisEl = document.getElementById("jenis");
    const kategoriEl = document.getElementById("kategori");
    const nominalEl = document.getElementById("nominal");
    const deskripsiEl = document.getElementById("deskripsi");
    const dompetEl = document.getElementById("dompet");
    const kepemilikanEl = document.getElementById("kepemilikan");

    const dompetDetailEl = document.getElementById("dompetDetail");

    const detailOptions = {
      Cash: ["Cash"],
      "M-Banking": ["BTN", "Mandiri", "BRI", "BSI"],
      "E-Wallet": ["Gopay", "Dana", "OVO", "ShopeePay", "LinkAja"],
    };

    // Update dropdown detail dompet saat dompet dipilih
    dompetEl.addEventListener("change", () => {
      const dompet = dompetEl.value;
      const options = detailOptions[dompet] || [];
      dompetDetailEl.innerHTML = '<option value="">-- Pilih --</option>'; // reset

      options.forEach((opt) => {
        const el = document.createElement("option");
        el.value = opt;
        el.textContent = opt;
        dompetDetailEl.appendChild(el);
      });
    });

    async function simpanTransaksi() {
      const jenis = jenisEl.value,
        kategori = kategoriEl.value,
        nominal = nominalEl.value.replace(/\./g, ""),
        deskripsi = deskripsiEl.value,
        dompet = dompetEl.value,
        kepemilikan = kepemilikanEl.value,
        dompetDetail = dompetDetailEl.value;

      if (!kategori || !nominal)
        return showToast("Lengkapi kategori dan nominal!", 3000, "error");

      // spinner aktif
      showLoading(true);

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          jenis,
          kategori,
          nominal,
          deskripsi,
          dompet,
          dompetDetail,
          kepemilikan,
        }),
      });

      // spinner hilang
      showLoading(false);

      // toast muncul setelah spinner hilang
      setTimeout(() => showOverlayToast("✅ Transaksi berhasil!"), 200);

      loadData();

      dompetDetailEl.value = "";

    async function loadData() {

  showLoading(true);

  try {

    const res = await fetch(SCRIPT_URL + "?t=" + Date.now());

    const data = await res.json();

    console.log("DATA API:", data);

    semuaData = data.transaksi || [];
    console.log("SEMUA DATA:", semuaData)
    semuaBudget = data.budget || [];

    renderDashboard();
    renderRiwayat(filter3HariTerakhir(semuaData));

  } catch (err) {

    console.error(err);
    showToast("Gagal memuat data",3000,"error");

  }

  showLoading(false);

}

    function filter3HariTerakhir(data) {
      const now = new Date();
      const tigaHariLalu = new Date(now);
      tigaHariLalu.setDate(now.getDate() - 3);
      return data.filter((t) => new Date(t.tanggal) >= tigaHariLalu);
    }

    function filterTanggal() {
      const s = document.getElementById("startDate").value;
      const e = document.getElementById("endDate").value;
      if (!s || !e) return showToast("Pilih tanggal awal dan akhir!");
      const start = new Date(s);
      const end = new Date(e);
      end.setHours(23, 59, 59, 999);
      const filtered = semuaData.filter((t) => {
        const td = new Date(t.tanggal);
        return td >= start && td <= end;
      });
      renderRiwayat(filtered);
    }

   function renderDashboard(){

let pendapatan = 0
let pengeluaran = 0
let cash = 0
let bank = 0
let wallet = 0

semuaData.forEach(trx=>{

const n = Number(trx.nominal) || 0
const jenis = (trx.jenis || "").trim().toLowerCase()

if(jenis === "pendapatan"){

pendapatan += n

if(trx.dompet === "Cash") cash += n
else if(trx.dompet === "M-Banking") bank += n
else wallet += n

}
else if(jenis === "pengeluaran"){

pengeluaran += n

if(trx.dompet === "Cash") cash -= n
else if(trx.dompet === "M-Banking") bank -= n
else wallet -= n

}

})

document.getElementById("totalPendapatan").innerText = formatRupiah(pendapatan)
document.getElementById("totalPengeluaran").innerText = formatRupiah(pengeluaran)
document.getElementById("saldo").innerText = formatRupiah(pendapatan - pengeluaran)

document.getElementById("saldoCash").innerText = formatRupiah(cash)
document.getElementById("saldoBank").innerText = formatRupiah(bank)
document.getElementById("saldoWallet").innerText = formatRupiah(wallet)

updateBudget()

}

    let detailOpen = null;
    const container = document.getElementById("detailSaldoContainer");

    document.querySelectorAll(".sub-balance").forEach((card) => {
      card.addEventListener("click", () => {
        const tipe = card.textContent.includes("Cash")
          ? "Cash"
          : card.textContent.includes("M-Banking")
            ? "M-Banking"
            : "E-Wallet";
        toggleDetail(tipe);
      });
    });

    function toggleDetail(tipe) {
      if (detailOpen === tipe) {
        // tutup
        container.style.height = "0";
        detailOpen = null;
      } else {
        // isi detail
        container.innerHTML = "";
        const dataFiltered = semuaData.filter((t) => t.dompet === tipe);
        if (dataFiltered.length === 0) {
          container.innerHTML = `<p class="text-center">Tidak ada data untuk ${tipe}</p>`;
        } else {
          const summary = {};
          dataFiltered.forEach((t) => {
            const key = `${t.kepemilikan} - ${t.dompetDetail}`;
            summary[key] =
              (summary[key] || 0) +
              (t.jenis === "Pendapatan"
                ? parseInt(t.nominal)
                : -parseInt(t.nominal));
          });
          Object.entries(summary).forEach(([k, v]) => {
            const card = document.createElement("div");
            card.className = "summary-card mb-2";
            card.innerHTML = `<h6>${k}</h6><h3>${formatRupiah(v)}</h3>`;
            container.appendChild(card);
          });
        }

        // tampilkan slide down
        container.style.display = "block";
        const scrollH = container.scrollHeight;
        container.style.height = scrollH + "px";
        detailOpen = tipe;
      }
    }

    function renderRiwayat(data) {
      const container = document.getElementById("riwayatContainer");
      container.innerHTML = "";
      if (data.length === 0) {
        container.innerHTML =
          "<p class='text-center mt-3'>Tidak ada transaksi.</p>";
        return;
      }
      data
        .slice()
        .reverse()
        .forEach((trx) => {
          container.innerHTML += `
      <div class="trx-card">
        <div class="trx-header">
          <h6>${trx.kategori.toUpperCase()}</h6>
          <span class="trx-date">${formatTanggal(trx.tanggal)}</span>
        </div>
        <div class="trx-detail">
          <span>${trx.jenis} • ${trx.kepemilikan} • ${trx.dompet} (${trx.dompetDetail
            })</span>
          <span class="trx-nominal ${trx.jenis.toLowerCase()}">${formatRupiah(
              trx.nominal
            )}</span>
        </div>
        <small class="trx-deskripsi">${capitalizeFirst(
              trx.deskripsi || "-"
            )}</small>
      </div>`;
        });
    }

    function filterTable() {
      const keyword = document.getElementById("filter").value.toLowerCase();
      const filtered = semuaData.filter((t) =>
        (t.kategori + t.dompet + t.jenis + t.deskripsi)
          .toLowerCase()
          .includes(keyword)
      );
      renderRiwayat(filtered);
    }

    function showToast(message, duration = 3000, type = "info") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerText = message;

      // optional: warna berbeda untuk type
      if (type === "error") toast.style.backgroundColor = "#e63946";
      else if (type === "success") toast.style.backgroundColor = "#22a707";

      container.appendChild(toast);

      // tampilkan animasi
      requestAnimationFrame(() => toast.classList.add("show"));

      // hilangkan otomatis
      setTimeout(() => {
        toast.classList.remove("show");
        toast.addEventListener("transitionend", () => toast.remove());
      }, duration);
    }

    let overlayToastVisible = false;

    function showOverlayToast(message = "✅ Berhasil!", duration = 1500) {
      if (overlayToastVisible) return;

      overlayToastVisible = true;
      const toast = document.getElementById("overlayToast");
      document.getElementById("overlayToastText").innerText = message;

      toast.classList.remove("show");
      toast.offsetWidth; // trigger reflow
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
        overlayToastVisible = false;
      }, duration);
    }

    function exportExcel() {
      const keyword = document.getElementById("filter").value.toLowerCase();
      const startDateVal = document.getElementById("startDate").value;
      const endDateVal = document.getElementById("endDate").value;
      let filtered = semuaData.slice();

      if (keyword) {
        filtered = filtered.filter((t) =>
          (t.kategori + t.dompet + t.jenis + t.deskripsi)
            .toLowerCase()
            .includes(keyword)
        );
      }

      if (startDateVal && endDateVal) {
        const start = new Date(startDateVal);
        const end = new Date(endDateVal);
        end.setHours(23, 59, 59, 999);
        filtered = filtered.filter((t) => {
          const td = new Date(t.tanggal);
          return td >= start && td <= end;
        });
      }

      if (filtered.length === 0) {
        showToast("Tidak ada data untuk diekspor!");
        return;
      }

      // Fungsi format tanggal
      const formatTanggalExcel = (t) => {
        const d = new Date(t);
        if (isNaN(d)) return "-";
        return `${d.getDate().toString().padStart(2, "0")}/${(
          d.getMonth() + 1
        )
          .toString()
          .padStart(2, "0")}/${d.getFullYear()} ${d
            .getHours()
            .toString()
            .padStart(2, "0")}:${d.getMinutes().toString().padStart(2, "0")}`;
      };

      // Buat header kolom CSV
      let csv = "Jenis,Kategori,Nominal,Deskripsi,Dompet,Tanggal\n";

      // Isi data CSV dengan format tanggal yang sudah diperbaiki
      filtered.forEach((trx) => {
        csv += `${trx.jenis},${trx.kategori},${trx.nominal},"${trx.deskripsi
          }",${trx.dompet},${formatTanggalExcel(trx.tanggal)}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "keuangan_nativan.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

async function setBudget(){

let val=document.getElementById("budgetInput").value.replace(/\./g,"")

if(!val) return

const now=new Date()

await fetch(SCRIPT_URL,{
method:"POST",
mode:"no-cors",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
setBudget:true,
bulan: now.getMonth()+1,
tahun: now.getFullYear(),
budget: val
})
})

showToast("Budget bulan ini tersimpan","2000","success")

loadData()

}

 function updateBudget(){

const now=new Date()

const bulan=now.getMonth()+1
const tahun=now.getFullYear()

// ambil budget bulan ini
let budget=0

semuaBudget.forEach(b=>{
if(b.bulan==bulan && b.tahun==tahun){
budget=parseInt(b.budget)
}
})

// hitung pengeluaran bulan ini
let pengeluaran=0

semuaData.forEach(t=>{

const d=new Date(t.tanggal)

if(
(t.jenis || "").toLowerCase() === "pengeluaran" &&
d.getMonth()+1===bulan &&
d.getFullYear()===tahun
){
pengeluaran += Number(t.nominal) || 0
}

})

let persen = budget ? (pengeluaran/budget)*100 : 0

let sisa = budget - pengeluaran

document.getElementById("budgetSisa").innerText =
"Budget tersisa: "+formatRupiah(Math.max(sisa,0))

const bar=document.getElementById("budgetBar")

bar.style.width=Math.min(persen,100)+"%"

const warning=document.getElementById("budgetWarning")

if(persen>=100){

bar.style.background="#ef4444"
warning.innerHTML="⚠ Budget bulan ini HABIS"
warning.className="budget-warning warning100"

}
else if(persen>=90){

bar.style.background="#fb923c"
warning.innerHTML="⚠ Budget hampir habis (90%)"
warning.className="budget-warning warning90"

}
else if(persen>=80){

bar.style.background="#fde047"
warning.innerHTML="⚠ Budget sudah 80%"
warning.className="budget-warning warning80"

}
else{

bar.style.background="#22c55e"
warning.innerHTML="Budget bulan ini aman"
warning.className="budget-warning"

}

}
